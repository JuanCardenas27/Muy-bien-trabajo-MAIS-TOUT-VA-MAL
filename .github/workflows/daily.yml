name: daily

# Producción (D1, R-30): solo corre en el repo del dueño, nunca en PRs ni forks.
# Los secretos viven en el environment `production`, limitado a la rama main.
on:
  schedule:
    - cron: "17 10 * * *" # 05:17 America/Bogota (D11)
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Publicar el bundle aunque la huella no cambie
        type: boolean
        default: false

concurrency:
  group: frances-prod
  cancel-in-progress: false

jobs:
  daily:
    name: daily
    if: vars.FRANCES_PROD == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
      actions: write
    environment:
      name: production
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: System packages
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          tesseract-ocr tesseract-ocr-fra tesseract-ocr-spa espeak-ng ffmpeg fonts-dejavu-core
      - name: Setup uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen
      - name: Lease
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >-
          uv run frances r2 lease acquire --holder "daily-$GITHUB_RUN_ID"
          --ttl 7200 --wait 1800
      - name: Pull
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run frances r2 pull --data data && cp deploy/frances.toml deploy/voices.yaml data/
      - name: Restore
        run: uv run frances restore --data data
      - name: Run daily
        id: daily
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set +e
          uv run frances run-daily --data data
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Dump
        if: steps.daily.outputs.code != '3'
        run: uv run frances dump --data data
      - name: Decide
        id: decide
        if: steps.daily.outputs.code != '3'
        env:
          FORCE: ${{ inputs.force_deploy }}
        run: |
          fp=$(printf '%s %s %s %s' "$GITHUB_SHA" "$(sha256sum < data/state/state.sql)" \
                "$(sha256sum < deploy/voices.yaml)" "$(sha256sum < deploy/frances.toml)" | sha256sum | cut -c1-64)
          prev=$(cat data/state/last_deploy_sha 2>/dev/null || true)
          deploy=false; { [ "$fp" != "$prev" ] || [ "$(jq -r .changed data/.cache/daily_summary.json 2>/dev/null || echo false)" = true ] || [ "$FORCE" = true ]; } && deploy=true
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - name: Bundle
        if: steps.daily.outputs.code != '3' && steps.decide.outputs.deploy == 'true'
        env:
          FRANCES_PASSPHRASE: ${{ secrets.FRANCES_PASSPHRASE }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: uv run frances bundle --out site --data data
      - name: Publish
        if: steps.daily.outputs.code != '3' && steps.decide.outputs.deploy == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FP: ${{ steps.decide.outputs.fingerprint }}
        run: >-
          uv run frances r2 publish --site site --build-id "$GITHUB_RUN_ID"
          && uv run frances r2 prune
          && echo "$FP" > data/state/last_deploy_sha
      - name: Push
        if: always() && steps.daily.outputs.code != '3'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run frances r2 push --label daily --data data
      - name: Release lease
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run frances r2 lease release --holder "daily-$GITHUB_RUN_ID"
      - name: Doctor
        if: always() && steps.daily.outputs.code != '3'
        run: uv run frances doctor --data data
      - name: Keepalive
        # D11: GitHub apaga los cron de un repo público tras 60 días sin actividad.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/daily.yml/enable"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/reconcile.yml/enable"
      - name: Report failure
        if: failure() || contains(fromJSON('["1","3"]'), steps.daily.outputs.code)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          uv run frances report-failure --run-url "$RUN_URL"
          --summary data/.cache/daily_summary.json
          --exit-code "${{ steps.daily.outputs.code == '3' && '3' || '1' }}" --data data
      - name: Finish
        if: always()
        run: |
          code="${{ steps.daily.outputs.code }}"
          if [ "$code" = "1" ] || [ "$code" = "3" ]; then
            exit "$code"
          fi
          if [ "$code" = "2" ]; then
            echo "::warning::Pipeline parcial: se reintenta mañana"
          fi
