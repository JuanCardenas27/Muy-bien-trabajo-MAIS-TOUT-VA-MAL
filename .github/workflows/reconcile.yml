name: reconcile

# Reconciliación semanal: detecta borrados en el Classroom (D11). Sin apt ni
# bundle; el daily siguiente publica por la huella (R-25).
on:
  schedule:
    - cron: "0 11 * * 0" # domingo 06:00 America/Bogota
  workflow_dispatch:

concurrency:
  group: frances-prod
  cancel-in-progress: false

jobs:
  reconcile:
    name: reconcile
    if: vars.FRANCES_PROD == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    environment:
      name: production
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen
      - name: Lease
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >-
          uv run frances r2 lease acquire --holder "reconcile-$GITHUB_RUN_ID"
          --ttl 3600 --wait 1800
      - name: Pull
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run frances r2 pull --data data && cp deploy/frances.toml deploy/voices.yaml data/
      - name: Restore
        run: uv run frances restore --data data
      - name: Reconcile
        id: daily
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set +e
          uv run frances reconcile --data data
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Dump
        if: steps.daily.outputs.code != '3'
        run: uv run frances dump --data data
      - name: Push
        if: always() && steps.daily.outputs.code != '3'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run frances r2 push --label reconcile --data data
      - name: Release lease
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: uv run frances r2 lease release --holder "reconcile-$GITHUB_RUN_ID"
      - name: Report failure
        if: failure() || contains(fromJSON('["1","3"]'), steps.daily.outputs.code)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          uv run frances report-failure --run-url "$RUN_URL"
          --summary data/.cache/daily_summary.json
          --exit-code "${{ steps.daily.outputs.code == '3' && '3' || '1' }}" --data data
      - name: Finish
        if: always()
        run: |
          code="${{ steps.daily.outputs.code }}"
          if [ "$code" = "1" ] || [ "$code" = "3" ]; then
            exit "$code"
          fi
          if [ "$code" = "2" ]; then
            echo "::warning::Pipeline parcial: se reintenta mañana"
          fi
